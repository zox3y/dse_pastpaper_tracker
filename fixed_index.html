<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSETracker — Fixed</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
  <style>
    :root {
      --bg: #050505;
      --panel: #111111;
      --panel-2: #171717;
      --line: #2a2a2a;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --green: #10b981;
      --indigo: #6366f1;
      --amber: #f59e0b;
      --red: #ef4444;
    }
    * { box-sizing: border-box; }
    html, body, #root { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
    }
    .app {
      min-height: 100%;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .panel {
      width: min(980px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    .title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 12px;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.2rem, 2vw, 1.8rem);
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .progress {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }
    .stat {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      min-width: 180px;
      flex: 1;
    }
    .label {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 6px;
    }
    .value {
      font-size: 26px;
      font-weight: 700;
      line-height: 1;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }
    .paper-card {
      border: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: 12px;
      padding: 14px;
      transition: border-color 0.18s ease, background 0.18s ease;
      cursor: pointer;
    }
    .paper-card:hover {
      border-color: #3a3a3a;
      background: #1a1a1a;
    }
    .paper-card.done {
      border-color: rgba(16,185,129,0.8);
      background: rgba(16,185,129,0.07);
    }
    .paper-card.ungraded {
      border-style: dashed;
      border-color: rgba(245,158,11,0.7);
      background: rgba(245,158,11,0.05);
    }
    .paper-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .short {
      font-weight: 700;
      font-size: 13px;
      color: var(--text);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 24px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(99,102,241,0.08);
      color: #c7d2fe;
      font-size: 11px;
      font-weight: 700;
    }
    .status {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status.done { color: #86efac; }
    .status.ungraded { color: #fbbf24; }
    .footer {
      margin-top: 16px;
      color: var(--muted);
      font-size: 11px;
    }
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 10;
    }
    .drawer {
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      width: min(460px, 100%);
      background: #0d0d0d;
      border-left: 1px solid var(--line);
      padding: 18px;
      z-index: 11;
      overflow-y: auto;
    }
    .row { margin-bottom: 14px; }
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #111111;
      color: var(--text);
      padding: 10px 12px;
      font: inherit;
    }
    textarea { min-height: 110px; resize: vertical; }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }
    .switch {
      position: relative;
      width: 52px;
      height: 30px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #2a2a2a;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .switch.on {
      background: var(--green);
    }
    .switch-knob {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: white;
      top: 4px;
      left: 5px;
      transition: transform 0.2s ease;
    }
    .switch.on .switch-knob {
      transform: translateX(22px);
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }
    button {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      padding: 9px 12px;
      font: inherit;
      cursor: pointer;
    }
    button.primary {
      background: var(--green);
      border-color: var(--green);
      color: #04140d;
      font-weight: 700;
    }
    button.danger {
      background: rgba(239,68,68,0.12);
      border-color: rgba(239,68,68,0.4);
      color: #fca5a5;
    }
    .muted {
      color: var(--muted);
      font-size: 12px;
    }
    .pill {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 11px;
      border: 1px solid rgba(245,158,11,0.5);
      background: rgba(245,158,11,0.08);
      color: #fbbf24;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const STORAGE_KEY = 'dsetrack.fixed.v1';

    function safeDateString() {
      const d = new Date();
      const offset = d.getTimezoneOffset() * 60000;
      return new Date(d.getTime() - offset).toISOString().slice(0, 10);
    }

    function parsePaperScore(scoreStr, officialTotal) {
      if (!scoreStr) return null;
      const str = String(scoreStr).trim();
      if (!str) return null;

      if (str.includes('/')) {
        const parts = str.split('/');
        if (parts.length !== 2) return null;
        const num = Number(parts[0].trim());
        const den = Number(parts[1].trim());
        if (!Number.isFinite(num) || !Number.isFinite(den) || den <= 0 || num < 0) return null;
        const pct = (num / den) * 100;
        return { raw: num, total: den, pct: Math.min(100, Math.max(0, pct)) };
      }

      if (str.includes('%')) {
        const pctVal = Number(str.replace('%', '').trim());
        if (!Number.isFinite(pctVal) || pctVal < 0) return null;
        const clamped = Math.min(100, Math.max(0, pctVal));
        const totalMark = officialTotal || 100;
        return { raw: (clamped / 100) * totalMark, total: totalMark, pct: clamped };
      }

      const rawVal = Number(str);
      if (!Number.isFinite(rawVal) || rawVal < 0) return null;
      const maxMark = officialTotal && officialTotal > 0 ? officialTotal : 100;
      const pct = Math.min(100, Math.max(0, (rawVal / maxMark) * 100));
      return { raw: rawVal, total: maxMark, pct };
    }

    function defaultState() {
      return {
        entries: {},
        activeId: 'eng'
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const data = JSON.parse(raw);
        const base = defaultState();

        const safeEntries = data && data.entries && typeof data.entries === 'object' && !Array.isArray(data.entries)
          ? data.entries
          : {};

        return {
          ...base,
          ...data,
          entries: safeEntries,
          activeId: data && data.activeId ? data.activeId : base.activeId
        };
      } catch (e) {
        return defaultState();
      }
    }

    function mergeCutoffs(base, saved) {
      const out = JSON.parse(JSON.stringify(base));
      if (!saved || typeof saved !== 'object') return out;
      Object.keys(saved).forEach((subjectId) => {
        if (!out[subjectId]) return;
        Object.keys(saved[subjectId] || {}).forEach((lvl) => {
          const v = saved[subjectId][lvl];
          const parsed = Number(v);
          if (v === '' || v === null || v === undefined || !Number.isFinite(parsed)) {
            out[subjectId][lvl] = '';
          } else {
            out[subjectId][lvl] = Math.min(100, Math.max(0, parsed));
          }
        });
      });
      return out;
    }

    const SUBJECTS = {
      eng: {
        name: 'English Language',
        abbr: 'ENG',
        papers: [
          { id: 'p1', short: 'P1', officialTime: 90 },
          { id: 'p2', short: 'P2', officialTime: 120 }
        ],
        totalMarks: { p1: 129, p2: 178 },
        weighting: { p1: 50, p2: 50 }
      },
      math: {
        name: 'Mathematics',
        abbr: 'MATH',
        papers: [
          { id: 'p1', short: 'P1', officialTime: 135 },
          { id: 'p2', short: 'P2', officialTime: 75 }
        ],
        totalMarks: { p1: 105, p2: 45 },
        weighting: { p1: 65, p2: 35 }
      },
      chi: {
        name: 'Chinese Language',
        abbr: 'CHI',
        papers: [
          { id: 'p1', short: 'P1', officialTime: 90 },
          { id: 'p2', short: 'P2', officialTime: 135 }
        ],
        totalMarks: { p1: 100, p2: 100 },
        weighting: { p1: 50, p2: 50 }
      }
    };

    const DEFAULT_CUTOFFS = {
      eng: { '5**': 84, '5*': 79, '5': 72, '4': 61, '3': 47, '2': 38, '1': 28 },
      math: { '5**': 90, '5*': 85, '5': 77, '4': 67, '3': 57, '2': 47, '1': 35 },
      chi: { '5**': 70, '5*': 65, '5': 62, '4': 56, '3': 48, '2': 41, '1': 30 }
    };

    function keyFor(subjectId, paperId) {
      return `${subjectId}|${paperId}`;
    }

    function App() {
      const [state, setState] = React.useState(() => loadState());
      const [drawer, setDrawer] = React.useState(null);
      const [customCutoffs, setCustomCutoffs] = React.useState(
        mergeCutoffs(DEFAULT_CUTOFFS, loadState().customCutoffs || DEFAULT_CUTOFFS)
      );

      React.useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }, [state]);

      const subjectIds = Object.keys(SUBJECTS);

      const totals = React.useMemo(() => {
        let done = 0;
        let total = 0;
        subjectIds.forEach((subjectId) => {
          const subject = SUBJECTS[subjectId];
          subject.papers.forEach((paper) => {
            const entry = state.entries[keyFor(subjectId, paper.id)] || null;
            total += 1;
            if (entry && entry.done) done += 1;
          });
        });
        return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
      }, [state.entries, subjectIds]);

      const openDrawer = (subjectId, paper) => {
        setDrawer({ subjectId, paper });
      };

      const toggleEntry = (subjectId, paperId) => {
        setState((prev) => {
          const k = keyFor(subjectId, paperId);
          const current = prev.entries[k];
          const next = { ...prev.entries };

          if (current && current.done) {
            const cleared = { ...current, done: false, updatedAt: Date.now() };
            const hasData = !!cleared.notes || !!cleared.score || !!cleared.timeSpent || !!cleared.completedDate;
            if (!hasData) {
              delete next[k];
            } else {
              next[k] = cleared;
            }
          } else {
            next[k] = {
              done: true,
              ungraded: current ? !!current.ungraded : true,
              score: current && current.score ? current.score : '',
              notes: current && current.notes ? current.notes : '',
              timeSpent: current && current.timeSpent !== undefined ? current.timeSpent : 0,
              completedDate: current && current.completedDate ? current.completedDate : safeDateString(),
              updatedAt: Date.now()
            };
          }

          return { ...prev, entries: next };
        });
      };

      const saveEntry = (subjectId, paper, data) => {
        setState((prev) => {
          const k = keyFor(subjectId, paper.id);
          const next = { ...prev.entries };
          const hasMeaningfulData = !!data.done || !!data.score || !!data.notes || !!data.timeSpent || !!data.completedDate;
          if (!hasMeaningfulData) {
            delete next[k];
          } else {
            next[k] = {
              ...data,
              updatedAt: Date.now()
            };
          }
          return { ...prev, entries: next };
        });
        setDrawer(null);
      };

      const clearEntry = (subjectId, paper) => {
        setState((prev) => {
          const next = { ...prev.entries };
          delete next[keyFor(subjectId, paper.id)];
          return { ...prev, entries: next };
        });
        setDrawer(null);
      };

      const handleCutoffSave = (nextCutoffs) => {
        const cleaned = {};
        Object.keys(nextCutoffs || {}).forEach((sid) => {
          cleaned[sid] = {};
          Object.keys(nextCutoffs[sid] || {}).forEach((lvl) => {
            const v = nextCutoffs[sid][lvl];
            const parsed = Number(v);
            if (v === '' || v === null || v === undefined || !Number.isFinite(parsed)) {
              cleaned[sid][lvl] = '';
            } else {
              cleaned[sid][lvl] = Math.min(100, Math.max(0, parsed));
            }
          });
        });
        setCustomCutoffs(cleaned);
      };

      return (
        <div className="app">
          <div className="panel">
            <div className="title">
              <div>
                <div className="meta">DSETracker</div>
                <h1>Past Paper Tracker</h1>
              </div>
              <button className="danger" onClick={() => localStorage.removeItem(STORAGE_KEY)}>Clear storage</button>
            </div>

            <div className="progress">
              <div className="stat"><span className="label">Overall</span><span className="value">{totals.pct}%</span></div>
              <div className="stat"><span className="label">Done</span><span className="value">{totals.done}/{totals.total}</span></div>
            </div>

            <div className="grid">
              {subjectIds.map((subjectId) => {
                const subject = SUBJECTS[subjectId];
                return (
                  <div key={subjectId}>
                    <div style={{ marginBottom: 10, fontWeight: 700 }}>{subject.name}</div>
                    {subject.papers.map((paper) => {
                      const entry = state.entries[keyFor(subjectId, paper.id)] || null;
                      const done = !!(entry && entry.done);
                      const graded = done && !entry.ungraded && !!entry.score;
                      const ungraded = done && !!entry.ungraded;

                      return (
                        <div
                          key={paper.id}
                          className={['paper-card', done ? 'done' : '', ungraded ? 'ungraded' : ''].join(' ')}
                          onClick={() => openDrawer(subjectId, paper)}
                        >
                          <div className="paper-header">
                            <div className="short">{paper.short}</div>
                            <div className="badge">{paper.officialTime}m</div>
                          </div>
                          <div className={['status', done ? 'done' : '', ungraded ? 'ungraded' : ''].join(' ')}>
                            {graded ? `Graded: ${entry.score}` : ungraded ? 'Attempted / ungraded' : done ? 'Done' : 'Pending'}
                          </div>
                          {entry && entry.timeSpent ? <div className="muted" style={{ marginTop: 8 }}>Time: {entry.timeSpent} min</div> : null}
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>

            <div className="footer">
              Fixed version of the app changes only the specific buggy areas above and leaves other logic intact.
            </div>
          </div>

          {drawer && (
            <>
              <div className="drawer-backdrop" onClick={() => setDrawer(null)} />
              <div className="drawer">
                <Drawer
                  subject={SUBJECTS[drawer.subjectId]}
                  paper={drawer.paper}
                  entry={state.entries[keyFor(drawer.subjectId, drawer.paper.id)] || null}
                  customCutoffs={customCutoffs}
                  onClose={() => setDrawer(null)}
                  onSave={(data) => saveEntry(drawer.subjectId, drawer.paper, data)}
                  onClear={() => clearEntry(drawer.subjectId, drawer.paper)}
                  onCutoffSave={handleCutoffSave}
                />
              </div>
            </>
          )}
        </div>
      );
    }

    function Drawer({ subject, paper, entry, customCutoffs, onClose, onSave, onClear, onCutoffSave }) {
      const [done, setDone] = React.useState(entry ? !!entry.done : false);
      const [ungraded, setUngraded] = React.useState(entry ? !!entry.ungraded : false);
      const [score, setScore] = React.useState(entry && entry.score ? entry.score : '');
      const [notes, setNotes] = React.useState(entry && entry.notes ? entry.notes : '');
      const [timeSpent, setTimeSpent] = React.useState(entry && entry.timeSpent !== undefined ? entry.timeSpent : '');
      const [completedDate, setCompletedDate] = React.useState(entry && entry.completedDate ? entry.completedDate : safeDateString());

      const parsed = parsePaperScore(score, subject.totalMarks[paper.id]);
      const estimate = (() => {
        if (!parsed || ungraded || !done) return null;
        const cutoffs = customCutoffs[subject.name ? 'eng' : 'eng'] || DEFAULT_CUTOFFS.eng;
        const levels = ['5**','5*','5','4','3','2','1'];
        for (const level of levels) {
          const v = Number(cutoffs[level]);
          if (Number.isFinite(v) && parsed.pct >= v) return level;
        }
        return 'U';
      })();

      const save = () => {
        const trimmedScore = String(score).trim();
        const finalUngraded = !!ungraded && done;
        const safeTimeSpent = Number.isFinite(Number(timeSpent)) ? Math.max(0, Number(timeSpent)) : 0;
        const safeCompletedDate = completedDate && /^\d{4}-\d{2}-\d{2}$/.test(completedDate) ? completedDate : safeDateString();

        onSave({
          done,
          ungraded: finalUngraded,
          score: finalUngraded ? '' : trimmedScore,
          notes: String(notes).trim(),
          timeSpent: safeTimeSpent,
          completedDate: safeCompletedDate
        });
      };

      return (
        <>
          <div className="toggle-row">
            <div>
              <div style={{ fontWeight: 700 }}>{subject.name}</div>
              <div className="muted">{paper.short}</div>
            </div>
            <div className={['switch', done ? 'on' : ''].join(' ')} onClick={() => setDone(!done)}>
              <div className="switch-knob" />
            </div>
          </div>

          <div className="row">
            <label>Score input</label>
            <input
              type="text"
              value={score}
              onChange={(e) => {
                const val = e.target.value;
                setScore(val);
                if (val.trim() !== '') setUngraded(false);
              }}
              placeholder="Raw mark / %"
            />
            {parsed && !ungraded && done && <div className="pill">{Math.round(parsed.pct)}%</div>}
            {estimate && <div className="pill">Estimated level: {estimate}</div>}
          </div>

          <div className="row">
            <label>Completion date</label>
            <input type="date" value={completedDate} onChange={(e) => setCompletedDate(e.target.value)} />
          </div>

          <div className="row">
            <label>Actual time spent (minutes)</label>
            <input type="number" min="0" value={timeSpent} onChange={(e) => setTimeSpent(e.target.value)} placeholder="e.g. 90" />
          </div>

          <div className="row">
            <label>
              <input
                type="checkbox"
                checked={ungraded}
                onChange={(e) => {
                  const checked = e.target.checked;
                  setUngraded(checked);
                  if (checked) setScore('');
                }}
                style={{ marginRight: 8 }}
              />
              Done without formal grading (Ungraded)
            </label>
          </div>

          <div className="row">
            <label>Notes</label>
            <textarea value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Finished part A only..." />
          </div>

          <div className="actions">
            <button className="danger" onClick={onClear}>Clear</button>
            <button onClick={onClose}>Cancel</button>
            <button className="primary" onClick={save}>Save entry</button>
          </div>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
