  /* One viewport unit everywhere: the visual viewport (dvh) is what the browser

<script>
(function () {
  function fail(msg) {
    var el = document.getElementById('boot-error');
    if (!el) return;
    el.style.display = 'block';
    el.textContent = 'DSETracker failed to start\n========================\n\n' + msg +
      '\n\nWhat to do:\n  1. Open DevTools (F12) → Console and copy the first red error.\n' +
      '  2. Check your internet / ad-blocker / school firewall is not blocking cdn.jsdelivr.net and unpkg.com.\n' +
      '  3. Try a different browser (Chrome, Edge, Firefox).\n  4. Try a phone hotspot.';
  }
  window.addEventListener('error', function (e) { if (e && e.message) fail('JS error: ' + e.message); });
  var checks = 0;
  var timer = setInterval(function () {
    checks++;
    var root = document.getElementById('root');
    var hasReact = !!window.React, hasReactDOM = !!window.ReactDOM;
    if (!hasReact || !hasReactDOM) {
      if (checks > 8) { clearInterval(timer); fail('React/ReactDOM did not load.'); } return;
    }
    if (root && root.children.length > 0) { clearInterval(timer); return; }
    if (checks > 16) { clearInterval(timer); fail('App did not mount. See Console.'); }
  }, 500);
})();
</script>

  function getLocalDateStr() {
    var d = new Date();
    var offset = d.getTimezoneOffset() * 60000;

  function isValidDateString(value) {
    if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
    var date = new Date(value + 'T00:00:00Z');
    if (isNaN(date.getTime()) || date.toISOString().slice(0, 10) !== value) return false;
    /* A paper cannot have been completed in the future; one day of slack for timezones. */
    var tomorrow = new Date();
    tomorrow.setUTCDate(tomorrow.getUTCDate() + 1);
    return date <= tomorrow;
  }

  /* ============================================================
     SCORE PARSER HELPER (STRICT — IMPOSSIBLE VALUES ARE REJECTED)
     ============================================================ */
  function parsePaperScore(scoreStr, officialTotal) {
    if (scoreStr === null || scoreStr === undefined) return null;
    var str = String(scoreStr).trim();
    if (!str) return null;

    var numberPattern = '\\d+(?:\\.\\d+)?';

    if (str.indexOf('/') >= 0) {
      if (!(new RegExp('^' + numberPattern + '\\s*\\/\\s*' + numberPattern + '$')).test(str)) return null;
      var parts = str.split('/');
      var num = Number(parts[0].trim());
      var den = Number(parts[1].trim());
      if (!isFinite(num) || !isFinite(den) || den <= 0 || num < 0) return null;
      /* A mark larger than the total is impossible, so reject it instead of clamping. */
      if (num > den) return null;

      var rawPct = (num / den) * 100;
      return { raw: num, total: den, pct: Math.min(100, Math.max(0, rawPct)) };
    }

    if (str.indexOf('%') >= 0) {
      if (!(new RegExp('^' + numberPattern + '\\s*%$')).test(str)) return null;
      var pctVal = Number(str.replace('%', '').trim());
      if (!isFinite(pctVal) || pctVal < 0) return null;
      /* Above 100% cannot happen, so reject it instead of clamping. */
      if (pctVal > 100) return null;
      var totalMark = officialTotal || 100;
      return { raw: (pctVal / 100) * totalMark, total: totalMark, pct: pctVal };
    }

    if (!(new RegExp('^' + numberPattern + '$')).test(str)) return null;
    var rawVal = Number(str);
    if (!isFinite(rawVal) || rawVal < 0) return null;
    var maxMark = officialTotal && officialTotal > 0 ? officialTotal : 100;
    if (rawVal > maxMark) return null;
    var computedPct = (rawVal / maxMark) * 100;
    return { raw: rawVal, total: maxMark, pct: Math.min(100, Math.max(0, computedPct)) };
  }

  /* Why a non-blank score string is unusable: 'invalid' | 'fraction' | 'percent' | 'total'.
     Returns null when the string is valid or blank. */
  function getScoreError(scoreStr, officialTotal) {
    if (scoreStr === null || scoreStr === undefined) return null;
    var str = String(scoreStr).trim();
    if (!str) return null;
    if (parsePaperScore(str, officialTotal)) return null;

    var numberPattern = '\\d+(?:\\.\\d+)?';
    if (str.indexOf('/') >= 0 && new RegExp('^' + numberPattern + '\\s*\\/\\s*' + numberPattern + '$').test(str)) {
      var parts = str.split('/');
      var num = Number(parts[0].trim());
      var den = Number(parts[1].trim());
      if (isFinite(num) && isFinite(den) && den > 0 && num > den) return 'fraction';
    }
    if (str.indexOf('%') >= 0 && new RegExp('^' + numberPattern + '\\s*%$').test(str)) {
      var pctVal = Number(str.replace('%', '').trim());
      if (isFinite(pctVal) && pctVal > 100) return 'percent';
    }
    if (new RegExp('^' + numberPattern + '$').test(str)) {
      var maxMark = officialTotal && officialTotal > 0 ? officialTotal : 100;
      if (Number(str) > maxMark) return 'total';
    }
    return 'invalid';
  }

  function ek(sid, row, pid) { return sid + '|' + row + '|' + pid; }
  function sanitizeEntries(entries, opts) {
    if (!entries || typeof entries !== 'object' || Array.isArray(entries)) return {};

    /* Accepts { bafsOption, vaOption }; the bare '2A'/'2B' string form is still honoured. */
    var bafsOption = (opts && typeof opts === 'object') ? opts.bafsOption : opts;
    var vaOption = (opts && typeof opts === 'object' && opts.vaOption === 'p2') ? 'p2' : 'p1';

    var safe = {};
    Object.keys(entries).forEach(function (key) {
      var parts = key.split('|');
      if (parts.length !== 3) return;

      var sid = parts[0], row = parts[1], pid = parts[2];
      var subject = SUBJECTS[sid];
      if (!subject || subject.rows.indexOf(row) < 0) return;

      /* BAFS and Visual Arts each swap one paper per row for the chosen option. Both
         variants are kept so rehydrating, importing or switching the option can never
         drop work already logged against the paper that is not currently selected. */
      var validPaper = (sid === 'bafs')
        ? (pid === 'p1' || pid === 'p2a' || pid === 'p2b')
        : (sid === 'va')
        ? (subject.papersFor(row, { vaOption: vaOption }).some(function (paper) { return paper.id === pid; }) ||
           subject.papersFor(row, { vaOption: vaOption === 'p2' ? 'p1' : 'p2' }).some(function (paper) { return paper.id === pid; }))
        : subject.papersFor(row, { bafsOption: bafsOption }).some(function (paper) { return paper.id === pid; });
      if (!validPaper) return;

      var entry = entries[key];
      if (!entry || typeof entry !== 'object' || Array.isArray(entry)) return;

      var score = typeof entry.score === 'string' ? entry.score : '';
      if (score && !parsePaperScore(score, subject.totalMarks ? subject.totalMarks[pid] : 100)) {
        score = '';
      }

      var time = Number(entry.timeSpent);
      if (!isFinite(time) || time < 0) time = 0;

      var completedDate = isValidDateString(entry.completedDate)
        ? entry.completedDate
        : (entry.done ? getLocalDateStr() : '');

      safe[key] = {
        done: entry.done === true,
        ungraded: entry.ungraded === true,
        score: score,
        notes: typeof entry.notes === 'string' ? entry.notes : '',
        timeSpent: Math.floor(time),
        completedDate: completedDate,
        updatedAt: isFinite(Number(entry.updatedAt)) ? Number(entry.updatedAt) : Date.now()
      };
    });

    return safe;
  }

  function subjectProgress(id, state) {
    var s = SUBJECTS[id]; if (!s) return { total: 0, done: 0, pct: 0 };
    var total = 0, done = 0;
    s.rows.forEach(function (row) {
      s.papersFor(row, state).forEach(function (p) {
        total++;
        var e = state.entries[ek(id, row, p.id)];
        if (e && e.done) done++;
      });
    });
    return { total: total, done: done, pct: total ? Math.round((done / total) * 100) : 0 };
  }

  function validateAllCutoffs(cutoffs) {
    var levels = ['5**', '5*', '5', '4', '3', '2', '1'];
    var sids = Object.keys(cutoffs || {});
    for (var s = 0; s < sids.length; s++) {
      var sid = sids[s];
      var subCutoffs = cutoffs[sid];
      if (!subCutoffs) continue;
      var activeLevels = [];
      for (var l = 0; l < levels.length; l++) {
        /* Blank values fall back to the default, so validate the value that will actually apply. */
        var val = resolveCutoff(sid, levels[l], cutoffs);
        if (val === null) continue;
        if (val < 0 || val > 100) {
          var subjObj = (typeof SUBJECTS !== 'undefined' && SUBJECTS[sid]);
          return (subjObj ? subjObj.abbr : sid) + ' — ' + levels[l] + ' must be a percentage between 0 and 100.';
        }
        activeLevels.push({ lvl: levels[l], val: val });
      }

      for (var i = 0; i < activeLevels.length - 1; i++) {
        if (activeLevels[i].val <= activeLevels[i + 1].val) {
          var subj = (typeof SUBJECTS !== 'undefined' && SUBJECTS[sid]);
          var subjName = subj ? (subj.abbr || subj.name) : sid;
          return subjName + ' — Threshold for ' + activeLevels[i].lvl + ' (' + activeLevels[i].val + '%) must be strictly higher than ' + activeLevels[i + 1].lvl + ' (' + activeLevels[i + 1].val + '%).';
        }
      }
    }
    return null;
  }

  /* ---------- GRADE PROJECTION HELPERS ---------- */
  var CUTOFF_LEVELS = ['5**', '5*', '5', '4', '3', '2', '1'];

  /* Effective threshold for one level. A blank or missing saved value means
     "use the default", so clearing a field can never make a level unreachable. */
  function resolveCutoff(subjectId, level, customCutoffs) {
    var savedSet = customCutoffs && customCutoffs[subjectId];
    var savedVal = savedSet ? savedSet[level] : undefined;
    var defaultSet = DEFAULT_CUTOFFS[subjectId] || DEFAULT_CUTOFFS.math;
    var defaultVal = defaultSet ? defaultSet[level] : undefined;

    var value = (savedVal !== '' && savedVal !== null && savedVal !== undefined)
      ? parseFloat(savedVal)
      : (typeof defaultVal === 'number' ? defaultVal : null);

    return (value === null || isNaN(value)) ? null : value;
  }

  function estimateLevel(pct, subjectId, customCutoffs) {
    for (var i = 0; i < CUTOFF_LEVELS.length; i++) {
      var cutoffVal = resolveCutoff(subjectId, CUTOFF_LEVELS[i], customCutoffs);
      if (cutoffVal !== null && pct >= cutoffVal) return CUTOFF_LEVELS[i];
    }
    return 'U';
  }

  /* Calculate Normalized Subject Percentage & Projected Grade.
     Also reports how many paper types actually have a score, and how much of the
     subject's weighting is covered here (e.g. SBA is not tracked). */
  function calculateSubjectPerformance(id, state) {
    var s = SUBJECTS[id];
    var emptyPerf = { weightedPct: null, estimatedLevel: null, scoredPaperTypes: 0, totalPaperTypes: 0, provisional: false, trackedWeight: 0, untrackedWeight: 100 };
    if (!s) return emptyPerf;

    var paperScores = {};
    var paperCounts = {};
    var paperWeights = {};

    s.rows.forEach(function (row) {
      s.papersFor(row, state).forEach(function (p) {
        var weight = (s.weighting && Number(s.weighting[p.id])) || 0;
        paperWeights[p.id] = weight;
        var e = state.entries[ek(id, row, p.id)];
        if (e && e.done && !e.ungraded && e.score) {
          var parsed = parsePaperScore(e.score, s.totalMarks ? s.totalMarks[p.id] : 100);
          if (parsed && !isNaN(parsed.pct)) {
            paperScores[p.id] = (paperScores[p.id] || 0) + parsed.pct;
            paperCounts[p.id] = (paperCounts[p.id] || 0) + 1;
          }
        }
      });
    });

    var totalPaperTypes = Object.keys(paperWeights).length;
    var scoredPaperTypes = Object.keys(paperScores).length;
    var trackedWeight = 0;
    Object.keys(paperWeights).forEach(function (pid) { trackedWeight += paperWeights[pid]; });
    trackedWeight = Math.min(100, Math.round(trackedWeight * 10) / 10);

    var coverage = {
      scoredPaperTypes: scoredPaperTypes,
      totalPaperTypes: totalPaperTypes,
      provisional: scoredPaperTypes > 0 && scoredPaperTypes < totalPaperTypes,
      trackedWeight: trackedWeight,
      untrackedWeight: Math.max(0, Math.round((100 - trackedWeight) * 10) / 10)
    };

    var totalWeight = 0;
    var weightedSum = 0;

    Object.keys(paperScores).forEach(function (pid) {
      var avgPct = paperScores[pid] / paperCounts[pid];
      var w = paperWeights[pid] || 0;
      weightedSum += avgPct * w;
      totalWeight += w;
    });

    if (totalWeight === 0) return Object.assign({ weightedPct: null, estimatedLevel: null }, coverage);

    var normalizedPct = weightedSum / totalWeight;
    var roundedPct = Math.round(normalizedPct * 10) / 10;

    var estimatedLevel = estimateLevel(roundedPct, id, state.customCutoffs);

    return Object.assign({ weightedPct: roundedPct, estimatedLevel: estimatedLevel }, coverage);
  }

  /* ---------- SAFE CUTOFF MERGING HELPER ---------- */
  function mergeCutoffs(base, saved) {
    var out = {};
    Object.keys(base).forEach(function (sid) {
      out[sid] = Object.assign({}, base[sid]);
    });

    if (!saved || typeof saved !== 'object' || Array.isArray(saved)) return out;

    var levels = ['5**', '5*', '5', '4', '3', '2', '1'];
    Object.keys(saved).forEach(function (sid) {
      if (!SUBJECTS[sid] || !saved[sid] ||
          typeof saved[sid] !== 'object' || Array.isArray(saved[sid])) return;
      if (!out[sid]) out[sid] = {};

      levels.forEach(function (level) {
        if (!Object.prototype.hasOwnProperty.call(saved[sid], level)) return;

        var value = saved[sid][level];
        /* Blank saved values mean "use the default", so never overwrite a good default with one. */
        if (value === '' || value === null || value === undefined) return;

        var parsed = Number(value);
        if (isFinite(parsed)) {
          var clamped = Math.min(100, Math.max(0, parsed));
          /* A saved value identical to the default carries no information. Dropping it lets
             future default updates reach users instead of being shadowed by a stale copy. */
          var defaults = DEFAULT_CUTOFFS[sid] || {};
          if (defaults[level] === clamped) return;
          out[sid][level] = clamped;
        }
      });

      if (!Object.keys(out[sid]).length) delete out[sid];
    });

    return out;
  }

  /* ---------- DEFAULT STATE ---------- */
  function defaultState() {
    return {
      version: 4, onboarded: false,
      core: ['eng', 'math', 'csd'],
      electives: ['m2', 'phy'],

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var data = JSON.parse(raw);
      var b = defaultState();

      /* An empty (or entirely invalid) saved subject list must fall back to the defaults,
         otherwise the dashboard has no subjects at all. */
      var core = Array.isArray(data.core)
        ? data.core.filter(function (x) { return SUBJECTS[x] && SUBJECTS[x].core; })
        : [];
      if (!core.length) core = b.core.slice();

      var electives = Array.isArray(data.electives)
        ? data.electives.filter(function (x) { return SUBJECTS[x] && !SUBJECTS[x].core; }).slice(0, 3)
        : b.electives.slice();

      var activeIds = core.concat(electives);
      var vaOption = data.vaOption === 'p2' ? 'p2' : 'p1';

      return Object.assign({}, b, {
        onboarded: !!data.onboarded,
        core: core,
        electives: electives,
        bafsOption: data.bafsOption === '2B' ? '2B' : '2A',
        vaOption: vaOption,
        active: data.active && activeIds.indexOf(data.active) >= 0 ? data.active : (activeIds[0] || 'eng'),
        entries: sanitizeEntries(data.entries, { bafsOption: data.bafsOption, vaOption: vaOption }),
        language: data.language === 'zh' ? 'zh' : 'en',
        theme: data.theme === 'light' ? 'light' : 'oled',
        sortMode: ['chrono','completion','score','time'].indexOf(data.sortMode) >= 0 ? data.sortMode : 'chrono',
        filterMode: ['all','done','pending'].indexOf(data.filterMode) >= 0 ? data.filterMode : 'all',
        customCutoffs: mergeCutoffs({}, data.customCutoffs)
      });
    } catch (err) { return defaultState(); }
  }

  /* Persist state and report whether the browser accepted the write. */
  function saveStateToStorage(state) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      return { ok: true, message: '' };
    } catch (err) {
      return {
        ok: false,
        message: (err && err.message) ? String(err.message) : 'Unknown storage error'

    }
  }

  /* Turn a parsed backup file into the state that would replace the current one.
     Throws when the payload is not a usable DSETracker backup. */
  function buildImportedState(data) {
    if (!data || typeof data !== 'object' || Array.isArray(data) ||
        !data.entries || typeof data.entries !== 'object' || Array.isArray(data.entries)) {
      throw new Error('Invalid schema format');
    }

    var core = ['eng', 'math', 'csd'];
    if (Array.isArray(data.core) && data.core.length) {
      var filteredCore = data.core.filter(function (id) { return SUBJECTS[id] && SUBJECTS[id].core; });
      /* English, Maths and CSD are compulsory: an incomplete list falls back to the trio. */
      var hasCompulsoryCore = ['eng', 'math', 'csd'].every(function (id) {
        return filteredCore.indexOf(id) >= 0;
      });
      if (hasCompulsoryCore) core = filteredCore;
    }
    var electives = Array.isArray(data.electives)
      ? data.electives.filter(function (id) { return SUBJECTS[id] && !SUBJECTS[id].core; }).slice(0, 3)
      : [];

    var validActiveIds = core.concat(electives);
    var targetActive = (data.active && validActiveIds.indexOf(data.active) >= 0)
      ? data.active
      : (validActiveIds[0] || 'eng');

    var bafsOpt = data.bafsOption === '2B' ? '2B' : '2A';
    var vaOpt = data.vaOption === 'p2' ? 'p2' : 'p1';

    return Object.assign({}, defaultState(), {
      onboarded: true,
      core: core,
      electives: electives,
      bafsOption: bafsOpt,
      vaOption: vaOpt,
      active: targetActive,
      entries: sanitizeEntries(data.entries, { bafsOption: bafsOpt, vaOption: vaOpt }),
      language: data.language === 'zh' ? 'zh' : 'en',
      theme: data.theme === 'light' ? 'light' : 'oled',
      sortMode: ['chrono', 'completion', 'score', 'time'].indexOf(data.sortMode) >= 0 ? data.sortMode : 'chrono',
      filterMode: ['all', 'done', 'pending'].indexOf(data.filterMode) >= 0 ? data.filterMode : 'all',

  /* Imports only take effect after the user confirms replacing current data. */

  /* ---------- SPREADSHEET (CSV) EXPORT ---------- */

  /* Quote only the fields that would otherwise break the row; "" escapes a quote. */
  function csvField(value) {
    var s = value === null || value === undefined ? '' : String(value);
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  /* Papers swapped by an option (BAFS 2A/2B, VA P1/P2) keep entries for both variants,
     so a row for the variant that is not selected still needs its name. */
  function paperById(sid, row, pid, state) {
    var subject = SUBJECTS[sid];
    if (!subject) return null;
    var list = subject.papersFor(row, state);
    var i;
    for (i = 0; i < list.length; i++) if (list[i].id === pid) return list[i];
    var alternate = sid === 'bafs'
      ? { bafsOption: state.bafsOption === '2B' ? '2A' : '2B' }
      : sid === 'va'
      ? { vaOption: state.vaOption === 'p2' ? 'p1' : 'p2' }
      : null;
    if (!alternate) return null;
    list = subject.papersFor(row, alternate);
    for (i = 0; i < list.length; i++) if (list[i].id === pid) return list[i];
    return null;
  }

  function entryStatusKey(entry) {
    var e = entry || {};
    var score = e.score ? String(e.score).trim() : '';
    var notesValue = e.notes ? String(e.notes).trim() : '';
    var time = Number(e.timeSpent) > 0;
    if (e.done) return (score && !e.ungraded) ? 'csv.graded' : 'csv.ungraded';
    if (score || notesValue || time) return 'csv.inProgress';
    return 'csv.notAttempted';
  }

  /* A full snapshot: metadata header block plus one row per paper with an entry. */
  function buildProgressCsv(state) {
    var activeIds = state.core.concat(state.electives);
    var coreNames = state.core.map(function (id) { return SUBJECTS[id] ? tName(SUBJECTS[id]) : id; });
    var electiveNames = state.electives.map(function (id) { return SUBJECTS[id] ? tName(SUBJECTS[id]) : id; });

    var done = 0, total = 0;
    activeIds.forEach(function (id) { var p = subjectProgress(id, state); done += p.done; total += p.total; });
    var overallPct = total ? Math.round((done / total) * 100) : 0;

    var now = new Date();
    var pad = function (n) { return ('0' + n).slice(-2); };
    var stamp = getLocalDateStr() + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());

    var meta = [
      'DSETracker Export',
      'Exported: ' + stamp,
      '',
      'Selected Subjects:',
      '  Core: ' + coreNames.join(', '),
      '  Electives: ' + electiveNames.join(', '),
      '',
      'Exam Target: ' + (EXAM_DATES[state.active] || ''),
      '',
      'Overall Progress: ' + done + ' / ' + total + ' papers (' + overallPct + '%)',
      ''
    ];

    /* Selected subjects first, then anything left over from an older selection. */
    var keys = Object.keys(state.entries || {}).filter(function (key) {
      var parts = key.split('|');
      return parts.length === 3 && SUBJECTS[parts[0]] && SUBJECTS[parts[0]].rows.indexOf(parts[1]) >= 0;
    });
    keys.sort(function (a, b) {
      var pa = a.split('|'), pb = b.split('|');
      var sa = activeIds.indexOf(pa[0]); if (sa < 0) sa = activeIds.length;
      var sb = activeIds.indexOf(pb[0]); if (sb < 0) sb = activeIds.length;
      if (sa !== sb) return sa - sb;
      if (pa[0] !== pb[0]) return pa[0] < pb[0] ? -1 : 1;
      var ra = ALL_ROWS.indexOf(pa[1]); if (ra < 0) ra = ALL_ROWS.length;
      var rb = ALL_ROWS.indexOf(pb[1]); if (rb < 0) rb = ALL_ROWS.length;
      if (ra !== rb) return ra - rb;
      return pa[1] < pb[1] ? -1 : (pa[1] > pb[1] ? 1 : 0);
    });

    var rows = [[
      'Subject', 'Year', 'Paper', 'Paper Name', 'Status', 'Score',
      'Percentage', 'Time Spent (min)', 'Completed Date', 'Notes'
    ].join(',')];

    keys.forEach(function (key) {
      var parts = key.split('|');
      var sid = parts[0], row = parts[1], pid = parts[2];
      var subject = SUBJECTS[sid];
      var entry = state.entries[key] || {};
      var paper = paperById(sid, row, pid, state);
      var score = entry.score ? String(entry.score) : '';
      var parsed = score ? parsePaperScore(score, subject.totalMarks ? subject.totalMarks[pid] : 100) : null;
      var timeSpent = Number(entry.timeSpent);

      rows.push([
        tName(subject),
        row,
        paper ? paper.short : pid,
        paper ? tName(paper) : '',
        t(entryStatusKey(entry)),
        score,
        parsed ? parsed.pct.toFixed(1) : '',
        timeSpent > 0 ? String(Math.floor(timeSpent)) : '',
        entry.completedDate || '',
        entry.notes || ''
      ].map(csvField).join(','));
    });

    return meta.concat(rows).join('\n') + '\n';
  }

  function rowLabel(k) { return k === 'SP' ? t('row.sample') : k === 'PP' ? t('row.practice') : k; }

      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); setToast(t('toast.exported'));

    var handleExportCsv = useCallback(function () {

      var url = URL.createObjectURL(blob);

    var confirmImport = useCallback(function () {

      setShowOnboarding(false);
      setToast(t('toast.imported'));

    var cancelImport = useCallback(function () { setPendingImport(null); }, []);

    var handleSaveConfig = useCallback(function (cfg) {

      });
      
      setShowSettings(false); 
      setShowOnboarding(false);
    }, []);

    var handleSaveCutoffs = useCallback(function (newCutoffs) {
      var cleaned = {};
      var invalid = false;
      var levels = ['5**', '5*', '5', '4', '3', '2', '1'];

      Object.keys(newCutoffs || {}).forEach(function (sid) {
        if (!SUBJECTS[sid]) return;
        cleaned[sid] = {};

        levels.forEach(function (level) {
          var value = newCutoffs[sid] && newCutoffs[sid][level];

          /* Blank means "use the default", so leave the level out instead of storing a dead entry. */
          if (value === '' || value === null || value === undefined) return;

          var parsed = Number(value);
          if (!isFinite(parsed)) {
            invalid = true;
            return;
          }

          cleaned[sid][level] = Math.min(100, Math.max(0, parsed));
        });
      });

      if (invalid) {
        setToast(t('toast.cutoffInvalid'));
        return;
      }

      /* Every save path validates ordering, not just the modal's own button. */
      var orderErr = validateAllCutoffs(cleaned);
      if (orderErr) {
        setToast(t('toast.cutoffInvalid'));
        return;
      }

      setState(function (s) {
        return Object.assign({}, s, { customCutoffs: cleaned });
      });
      setShowCutoffModal(false);
      setToast(t('toast.cutoffSaved'));
    }, []);
    
    var clearAllModalEl = showClearConfirm
      ? h(ClearAllModal, {
          onCancel: handleCancelClearAll,
          onConfirm: function () {
            try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
            window.location.reload();
          }
        })
      : null;

    var importModalEl = pendingImport
      ? h(ImportConfirmModal, { fileName: pendingImport.fileName, onCancel: cancelImport, onConfirm: confirmImport })
      : null;

    var storageBanner = storageError
      ? h('div', { role: 'alert', className: 'flex flex-wrap items-center gap-x-2 gap-y-1.5 border-b border-red-500/40 bg-red-500/10 px-4 py-2 text-[11px] leading-snug text-red-200' },
          h('span', { className: 'font-semibold' }, t('storage.errorTitle')),
          h('span', { className: 'min-w-[180px] flex-1' }, t('storage.error')),
          h('button', { type: 'button', onClick: handleExport, className: 'rounded-md border border-red-500/40 px-2 py-1 font-semibold text-red-100 transition hover:bg-red-500/20' }, t('storage.exportNow')))
      : null;
    
    var toggleLanguage = useCallback(function () { setState(function (s) { var n = Object.assign({}, s); n.language = s.language === 'en' ? 'zh' : 'en'; return n; }); }, []);
    var toggleTheme = useCallback(function () {
      if (document.startViewTransition) {
        document.startViewTransition(function () {
          setState(function (s) {
            var n = Object.assign({}, s);
            n.theme = s.theme === 'oled' ? 'light' : 'oled';
            return n;
          });
        });
      } else {
        setState(function (s) {
          var n = Object.assign({}, s);
          n.theme = s.theme === 'oled' ? 'light' : 'oled';
          return n;
        });
      }
    }, []);

    var drawerData = useMemo(function () {
      if (!drawer) return null; var subject = SUBJECTS[drawer.sid]; if (!subject) return null;
      var papers = subject.papersFor(drawer.row, state); var paper = papers.filter(function (p) { return p.id === drawer.pid; })[0]; if (!paper) return null;
      return { subject: subject, paper: paper, entry: state.entries[ek(drawer.sid, drawer.row, drawer.pid)] };
    }, [drawer, state]);

    var drawerEl = drawerData ? h(Drawer, { key: drawer.sid + '-' + drawer.row + '-' + drawer.pid, subject: drawerData.subject, row: drawer.row, paper: drawerData.paper, entry: drawerData.entry, customCutoffs: state.customCutoffs, onClose: function () { setDrawer(null); }, onSave: function (data) { saveEntry(drawer.sid, drawer.row, drawer.pid, data); }, onClear: function () { clearEntry(drawer.sid, drawer.row, drawer.pid); } }) : null;
    var modalEl = (showOnboarding || showSettings) ? h(SubjectModal, { state: state, mode: showOnboarding ? 'onboarding' : 'settings', onClose: function () { setShowSettings(false); }, onSave: handleSaveConfig }) : null;
    var cutoffModalEl = showCutoffModal ? h(CutoffModal, { state: state, onClose: function() { setShowCutoffModal(false); }, onSave: handleSaveCutoffs }) : null;

    var tipEl = tip ? h('div', { className: 'dse-tooltip pointer-events-none fixed z-[100] max-w-[240px] -translate-x-1/2 rounded-md border border-line bg-[#1a1a1a] px-2 py-1 text-[10px] font-medium leading-snug text-zinc-200 shadow-xl', style: { left: tip.x, top: Math.max(8, tip.y - 34) } }, tip.text) : null;
    var toastEl = toast ? h('div', { className: 'fixed left-1/2 z-[110] -translate-x-1/2 anim-toast', style: { bottom: 'calc(1.25rem + env(safe-area-inset-bottom, 0px))' } }, h('div', { className: 'flex items-center gap-2 rounded-xl border border-line bg-[#141414] px-4 py-2.5 text-[12px] font-medium text-zinc-100 shadow-2xl' }, h('span', { className: 'grid h-4 w-4 place-items-center rounded-full bg-emerald-500 text-[#04140d]' }, h(CheckIcon, { className: 'h-2.5 w-2.5' })), toast)) : null;
    var sidebarBackdrop = sidebarOpen ? h('div', { className: 'fixed inset-0 z-30 bg-black/60 backdrop-blur-sm lg:hidden', onClick: function () { setSidebarOpen(false); } }) : null;

    return h('div', { className: 'flex h-app overflow-hidden bg-black font-sans text-zinc-200' },
      sidebarBackdrop,
      h('div', { className: cls('fixed left-0 top-0 z-40 h-app transition-transform duration-300 lg:static lg:h-full lg:translate-x-0', sidebarOpen ? 'translate-x-0' : '-translate-x-full') },
        h(Sidebar, { state: state, activeIds: activeIds, overall: overall, setActive: setActive, onSettings: function () { rememberTrigger(); setShowSettings(true); setSidebarOpen(false); }, onOpenCutoffs: function() { rememberTrigger(); setShowCutoffModal(true); setSidebarOpen(false); }, onExport: handleExport, onExportCsv: handleExportCsv, onImport: function () { rememberTrigger(); if (fileRef.current) fileRef.current.click(); } /* keep the panel open: focus returns to this button */, onClearAll: function () { rememberTrigger(); setShowClearConfirm(true); }, onClose: function () { setSidebarOpen(false); }, toggleLanguage: toggleLanguage, toggleTheme: toggleTheme })),
      h('main', { className: 'flex min-w-0 flex-1 flex-col overflow-hidden' },
        storageBanner,
        h('div', { className: 'flex-1 overflow-y-auto dse-scroll' },
          h(StatCards, { state: state }),
          h(SubjectPanel, { state: state, setState: setState, activeId: state.active, tipProps: tipProps, openDrawer: openDrawer, toggleEntry: toggleEntry, onOpenMenu: function () { setSidebarOpen(true); }, onToggleLanguage: toggleLanguage }))),
      h('input', { ref: fileRef, type: 'file', accept: 'application/json,.json', className: 'hidden', onChange: handleImportFile }),
      drawerEl, modalEl, cutoffModalEl, clearAllModalEl, importModalEl, tipEl, toastEl);
  }

  /* Exposed for the regression tests in tests/regression.test.mjs. */
  if (typeof window !== 'undefined') {
    window.__DSETRACK_TEST__ = {
      STORAGE_KEY: STORAGE_KEY,
      SUBJECTS: SUBJECTS,
      DEFAULT_CUTOFFS: DEFAULT_CUTOFFS,
      ek: ek,
      defaultState: defaultState,
      loadState: loadState,
      mergeCutoffs: mergeCutoffs,
      isValidDateString: isValidDateString,
      resolveCutoff: resolveCutoff,
      estimateLevel: estimateLevel,
      validateAllCutoffs: validateAllCutoffs,
      sanitizeEntries: sanitizeEntries,
      parsePaperScore: parsePaperScore,
      getScoreError: getScoreError,
      buildImportedState: buildImportedState,
      buildProgressCsv: buildProgressCsv,

  }

  var rootEl = document.getElementById('root');
  var reactRoot = ReactDOM.createRoot(rootEl);
  reactRoot.render(h(App));
})();
</script>
