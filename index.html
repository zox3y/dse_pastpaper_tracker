<script>
(function () {
  function fail(msg) {
    var el = document.getElementById('boot-error');
    if (!el) return;
    el.style.display = 'block';
    el.textContent = 'DSETracker failed to start\n========================\n\n' + msg +
      '\n\nWhat to do:\n  1. Open DevTools (F12) → Console and copy the first red error.\n' +
      '  2. Check your internet / ad-blocker / school firewall is not blocking cdn.jsdelivr.net and unpkg.com.\n' +
      '  3. Try a different browser (Chrome, Edge, Firefox).\n  4. Try a phone hotspot.';
  }
  window.addEventListener('error', function (e) { if (e && e.message) fail('JS error: ' + e.message); });
  var checks = 0;
  var timer = setInterval(function () {
    checks++;
    var root = document.getElementById('root');
    var hasReact = !!window.React, hasReactDOM = !!window.ReactDOM;
    if (!hasReact || !hasReactDOM) {
      if (checks > 8) { clearInterval(timer); fail('React/ReactDOM did not load.'); } return;
    }
    if (root && root.children.length > 0) { clearInterval(timer); return; }
    if (checks > 16) { clearInterval(timer); fail('App did not mount. See Console.'); }
  }, 500);
})();
</script>

  function isValidDateString(value) {
    if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
    var date = new Date(value + 'T00:00:00Z');
    if (isNaN(date.getTime()) || date.toISOString().slice(0, 10) !== value) return false;
    /* A paper cannot have been completed in the future; one day of slack for timezones. */

  /* ============================================================
     SCORE PARSER HELPER (STRICT — IMPOSSIBLE VALUES ARE REJECTED)
     ============================================================ */
  function parsePaperScore(scoreStr, officialTotal) {
    if (scoreStr === null || scoreStr === undefined) return null;
    var str = String(scoreStr).trim();
    if (!str) return null;

    var numberPattern = '\\d+(?:\\.\\d+)?';

    if (str.indexOf('/') >= 0) {
      if (!(new RegExp('^' + numberPattern + '\\s*\\/\\s*' + numberPattern + '$')).test(str)) return null;
      var parts = str.split('/');
      var num = Number(parts[0].trim());
      var den = Number(parts[1].trim());
      if (!isFinite(num) || !isFinite(den) || den <= 0 || num < 0) return null;
      /* A mark larger than the total is impossible, so reject it instead of clamping. */
      if (num > den) return null;

      var rawPct = (num / den) * 100;
      return { raw: num, total: den, pct: Math.min(100, Math.max(0, rawPct)) };
    }

    if (str.indexOf('%') >= 0) {
      if (!(new RegExp('^' + numberPattern + '\\s*%$')).test(str)) return null;
      var pctVal = Number(str.replace('%', '').trim());
      if (!isFinite(pctVal) || pctVal < 0) return null;
      /* Above 100% cannot happen, so reject it instead of clamping. */
      if (pctVal > 100) return null;
      var totalMark = officialTotal || 100;
      return { raw: (pctVal / 100) * totalMark, total: totalMark, pct: pctVal };
    }

    if (!(new RegExp('^' + numberPattern + '$')).test(str)) return null;
    var rawVal = Number(str);
    if (!isFinite(rawVal) || rawVal < 0) return null;
    var maxMark = officialTotal && officialTotal > 0 ? officialTotal : 100;
    if (rawVal > maxMark) return null;
    var computedPct = (rawVal / maxMark) * 100;
    return { raw: rawVal, total: maxMark, pct: Math.min(100, Math.max(0, computedPct)) };
  }

  /* Why a non-blank score string is unusable: 'invalid' | 'fraction' | 'percent' | 'total'.
     Returns null when the string is valid or blank. */
  function getScoreError(scoreStr, officialTotal) {
    if (scoreStr === null || scoreStr === undefined) return null;
    var str = String(scoreStr).trim();
    if (!str) return null;
    if (parsePaperScore(str, officialTotal)) return null;

    var numberPattern = '\\d+(?:\\.\\d+)?';
    if (str.indexOf('/') >= 0 && new RegExp('^' + numberPattern + '\\s*\\/\\s*' + numberPattern + '$').test(str)) {
      var parts = str.split('/');
      var num = Number(parts[0].trim());
      var den = Number(parts[1].trim());
      if (isFinite(num) && isFinite(den) && den > 0 && num > den) return 'fraction';
    }
    if (str.indexOf('%') >= 0 && new RegExp('^' + numberPattern + '\\s*%$').test(str)) {
      var pctVal = Number(str.replace('%', '').trim());
      if (isFinite(pctVal) && pctVal > 100) return 'percent';
    }
    if (new RegExp('^' + numberPattern + '$').test(str)) {
      var maxMark = officialTotal && officialTotal > 0 ? officialTotal : 100;
      if (Number(str) > maxMark) return 'total';
    }
    return 'invalid';
  }

  function ek(sid, row, pid) { return sid + '|' + row + '|' + pid; }
  function sanitizeEntries(entries, opts) {
    if (!entries || typeof entries !== 'object' || Array.isArray(entries)) return {};

    /* Accepts { bafsOption, vaOption }; the bare '2A'/'2B' string form is still honoured. */
    var bafsOption = (opts && typeof opts === 'object') ? opts.bafsOption : opts;
    var vaOption = (opts && typeof opts === 'object' && opts.vaOption === 'p2') ? 'p2' : 'p1';

    var safe = {};
    Object.keys(entries).forEach(function (key) {
      var parts = key.split('|');
      if (parts.length !== 3) return;

      var sid = parts[0], row = parts[1], pid = parts[2];
      var subject = SUBJECTS[sid];
      if (!subject || subject.rows.indexOf(row) < 0) return;

      /* BAFS and Visual Arts each swap one paper per row for the chosen option. Both
         variants are kept so rehydrating, importing or switching the option can never
         drop work already logged against the paper that is not currently selected. */
      var validPaper = (sid === 'bafs')
        ? (pid === 'p1' || pid === 'p2a' || pid === 'p2b')
        : (sid === 'va')
        ? (subject.papersFor(row, { vaOption: vaOption }).some(function (paper) { return paper.id === pid; }) ||
           subject.papersFor(row, { vaOption: vaOption === 'p2' ? 'p1' : 'p2' }).some(function (paper) { return paper.id === pid; }))
        : subject.papersFor(row, { bafsOption: bafsOption }).some(function (paper) { return paper.id === pid; });
      if (!validPaper) return;

      var entry = entries[key];
      if (!entry || typeof entry !== 'object' || Array.isArray(entry)) return;

      var score = typeof entry.score === 'string' ? entry.score : '';
      if (score && !parsePaperScore(score, subject.totalMarks ? subject.totalMarks[pid] : 100)) {
        score = '';
      }

      var time = Number(entry.timeSpent);
      if (!isFinite(time) || time < 0) time = 0;

      var completedDate = isValidDateString(entry.completedDate)
        ? entry.completedDate
        : (entry.done ? getLocalDateStr() : '');

      safe[key] = {
        done: entry.done === true,
        ungraded: entry.ungraded === true,
        score: score,
        notes: typeof entry.notes === 'string' ? entry.notes : '',
        timeSpent: Math.floor(time),
        completedDate: completedDate,
        updatedAt: isFinite(Number(entry.updatedAt)) ? Number(entry.updatedAt) : Date.now()
      };
    });

  }

  function subjectProgress(id, state) {
    var s = SUBJECTS[id]; if (!s) return { total: 0, done: 0, pct: 0 };
    var total = 0, done = 0;
    s.rows.forEach(function (row) {
      s.papersFor(row, state).forEach(function (p) {
        total++;

    return { total: total, done: done, pct: total ? Math.round((done / total) * 100) : 0 };

  function validateAllCutoffs(cutoffs) {
    var levels = ['5**', '5*', '5', '4', '3', '2', '1'];
    var sids = Object.keys(cutoffs || {});
    for (var s = 0; s < sids.length; s++) {
      var sid = sids[s];
      var subCutoffs = cutoffs[sid];
      if (!subCutoffs) continue;
      var activeLevels = [];
      for (var l = 0; l < levels.length; l++) {
        /* Blank values fall back to the default, so validate the value that will actually apply. */
        var val = resolveCutoff(sid, levels[l], cutoffs);
        if (val === null) continue;
        if (val < 0 || val > 100) {
          var subjObj = (typeof SUBJECTS !== 'undefined' && SUBJECTS[sid]);
          return t('cutoff.error.range', { abbr: subjObj ? subjObj.abbr : sid, lvl: levels[l] });
        }
        activeLevels.push({ lvl: levels[l], val: val });
      }

      for (var i = 0; i < activeLevels.length - 1; i++) {
        if (activeLevels[i].val <= activeLevels[i + 1].val) {
          var subj = (typeof SUBJECTS !== 'undefined' && SUBJECTS[sid]);
          var subjName = subj ? (subj.abbr || subj.name) : sid;
          return t('cutoff.error.order', {
            abbr: subjName,
            lvl: activeLevels[i].lvl,
            val: activeLevels[i].val,
            nextLvl: activeLevels[i + 1].lvl,
            nextVal: activeLevels[i + 1].val

  /* ---------- GRADE PROJECTION HELPERS ---------- */
  var CUTOFF_LEVELS = ['5**', '5*', '5', '4', '3', '2', '1'];

  function levelBadgeClasses(level, provisional) {
    var tier;
    if (level === '5**') tier = 'bg-amber-500/20 text-amber-300 border-amber-500/40';
    else if (level === '5*') tier = 'bg-violet-500/20 text-violet-300 border-violet-500/40';
    else if (level === '5') tier = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40';
    else if (level === '4') tier = 'bg-sky-500/20 text-sky-300 border-sky-500/40';
    else if (level === '3') tier = 'bg-slate-500/20 text-slate-300 border-slate-500/40';
    else tier = 'bg-rose-500/20 text-rose-300 border-rose-500/40';
    return cls(tier, provisional ? 'border-dashed' : '');

  /* A preset phrase only counts when it appears as its own line in the notes, so an
     ad-hoc sentence like "no need to redo" can never flag the paper. Both languages are
     checked so a note written in the other UI language is still recognised. */
  function notesHasPreset(notes, key) {
    if (!notes) return false;
    var phraseEn = STRINGS.en[key];
    var phraseZh = STRINGS.zh[key];
    var lines = String(notes).split('\n').map(function (line) { return line.trim(); });
    return (!!phraseEn && lines.indexOf(phraseEn) >= 0) ||
           (!!phraseZh && lines.indexOf(phraseZh) >= 0);
  }

  /* Effective threshold for one level. A blank or missing saved value means
     "use the default", so clearing a field can never make a level unreachable. */
  function resolveCutoff(subjectId, level, customCutoffs) {
    var savedSet = customCutoffs && customCutoffs[subjectId];
    var savedVal = savedSet ? savedSet[level] : undefined;
    var defaultSet = DEFAULT_CUTOFFS[subjectId] || DEFAULT_CUTOFFS.math;
    var defaultVal = defaultSet ? defaultSet[level] : undefined;

    var value = (savedVal !== '' && savedVal !== null && savedVal !== undefined)
      ? parseFloat(savedVal)
      : (typeof defaultVal === 'number' ? defaultVal : null);

    return (value === null || isNaN(value)) ? null : value;
  }

  function estimateLevel(pct, subjectId, customCutoffs) {
    for (var i = 0; i < CUTOFF_LEVELS.length; i++) {
      var cutoffVal = resolveCutoff(subjectId, CUTOFF_LEVELS[i], customCutoffs);
      if (cutoffVal !== null && pct >= cutoffVal) return CUTOFF_LEVELS[i];
    }
    return 'U';
  }

  function paperNeedsRedo(subj, pid, entry, state) {
    if (!entry) return false;
    if (notesHasPreset(entry.notes, 'preset.redo')) return true;
    if (entry.done && !entry.ungraded && entry.score) {
      var maxMark = subj && subj.totalMarks ? subj.totalMarks[pid] : 100;
      var parsed = parsePaperScore(entry.score, maxMark);
      var targetLvl = (state && state.targetLevel) || '4';
      var cutoff = resolveCutoff(subj.id, targetLvl, state && state.customCutoffs);
      if (parsed && cutoff !== null && parsed.pct < cutoff) return true;
    }
    return false;
  }

  /* Calculate Normalized Subject Percentage & Projected Grade.
     Also reports how many paper types actually have a score, and how much of the
     subject's weighting is covered here (e.g. SBA is not tracked). */
  function calculateSubjectPerformance(id, state) {
    var s = SUBJECTS[id];
    var emptyPerf = { weightedPct: null, estimatedLevel: null, scoredPaperTypes: 0, totalPaperTypes: 0, provisional: false, trackedWeight: 0, untrackedWeight: 100 };
    if (!s) return emptyPerf;

    var paperScores = {};
    var paperCounts = {};
    var paperWeights = {};

    s.rows.forEach(function (row) {
      s.papersFor(row, state).forEach(function (p) {
        var weight = (s.weighting && Number(s.weighting[p.id])) || 0;
        paperWeights[p.id] = weight;
        var e = state.entries[ek(id, row, p.id)];
        if (e && e.done && !e.ungraded && e.score) {
          var parsed = parsePaperScore(e.score, s.totalMarks ? s.totalMarks[p.id] : 100);
          if (parsed && !isNaN(parsed.pct)) {
            paperScores[p.id] = (paperScores[p.id] || 0) + parsed.pct;
            paperCounts[p.id] = (paperCounts[p.id] || 0) + 1;
          }
        }
      });
    });

    var totalPaperTypes = Object.keys(paperWeights).length;
    var scoredPaperTypes = Object.keys(paperScores).length;
    var trackedWeight = 0;
    Object.keys(paperWeights).forEach(function (pid) { trackedWeight += paperWeights[pid]; });
    trackedWeight = Math.min(100, Math.round(trackedWeight * 10) / 10);

    var coverage = {
      scoredPaperTypes: scoredPaperTypes,
      totalPaperTypes: totalPaperTypes,
      provisional: scoredPaperTypes > 0 && scoredPaperTypes < totalPaperTypes,
      trackedWeight: trackedWeight,
      untrackedWeight: Math.max(0, Math.round((100 - trackedWeight) * 10) / 10)
    };

    var totalWeight = 0;
    var weightedSum = 0;

    Object.keys(paperScores).forEach(function (pid) {
      var avgPct = paperScores[pid] / paperCounts[pid];
      var w = paperWeights[pid] || 0;
      weightedSum += avgPct * w;
      totalWeight += w;
    });

    if (totalWeight === 0) return Object.assign({ weightedPct: null, estimatedLevel: null }, coverage);

    var normalizedPct = weightedSum / totalWeight;
    var roundedPct = Math.round(normalizedPct * 10) / 10;

    var estimatedLevel = estimateLevel(roundedPct, id, state.customCutoffs);

    return Object.assign({ weightedPct: roundedPct, estimatedLevel: estimatedLevel }, coverage);
  }

  /* ---------- SAFE CUTOFF MERGING HELPER ---------- */
  function mergeCutoffs(base, saved) {
    var out = {};
    Object.keys(base).forEach(function (sid) {
      out[sid] = Object.assign({}, base[sid]);
    });

    if (!saved || typeof saved !== 'object' || Array.isArray(saved)) return out;

    var levels = ['5**', '5*', '5', '4', '3', '2', '1'];
    Object.keys(saved).forEach(function (sid) {
      if (!SUBJECTS[sid] || !saved[sid] ||
          typeof saved[sid] !== 'object' || Array.isArray(saved[sid])) return;
      if (!out[sid]) out[sid] = {};

      levels.forEach(function (level) {
        if (!Object.prototype.hasOwnProperty.call(saved[sid], level)) return;

        var value = saved[sid][level];
        /* Blank saved values mean "use the default", so never overwrite a good default with one. */
        if (value === '' || value === null || value === undefined) return;

        var parsed = Number(value);
        if (isFinite(parsed)) {
          var clamped = Math.min(100, Math.max(0, parsed));
          /* A saved value identical to the default carries no information. Dropping it lets
             future default updates reach users instead of being shadowed by a stale copy. */
          var defaults = DEFAULT_CUTOFFS[sid] || {};
          if (defaults[level] === clamped) return;
          out[sid][level] = clamped;
        }
      });

      if (!Object.keys(out[sid]).length) delete out[sid];
    });

    return out;
  }

  function defaultState() {

  function loadState() {

      var core = Array.isArray(data.core)
        ? data.core.filter(function (x, i, arr) { return SUBJECTS[x] && SUBJECTS[x].core && arr.indexOf(x) === i; })
        : [];

      var electives = Array.isArray(data.electives)
        ? data.electives.filter(function (x, i, arr) { return SUBJECTS[x] && !SUBJECTS[x].core && arr.indexOf(x) === i; }).slice(0, 3)
        : b.electives.slice();

      var activeIds = core.concat(electives);

  /* Turn a parsed backup file into the state that would replace the current one.

  function buildImportedState(data) {

        !data.entries || typeof data.entries !== 'object' || Array.isArray(data.entries)) {
      throw new Error('Invalid schema format');
    }

    var core = ['eng', 'math', 'csd'];
    if (Array.isArray(data.core) && data.core.length) {
      var filteredCore = data.core.filter(function (id, i, arr) { return SUBJECTS[id] && SUBJECTS[id].core && arr.indexOf(id) === i; });
      /* English, Maths and CSD are compulsory: an incomplete list falls back to the trio. */
      var hasCompulsoryCore = ['eng', 'math', 'csd'].every(function (id) {
        return filteredCore.indexOf(id) >= 0;
      });
      if (hasCompulsoryCore) core = filteredCore;
    }
    var electives = Array.isArray(data.electives)
      ? data.electives.filter(function (id, i, arr) { return SUBJECTS[id] && !SUBJECTS[id].core && arr.indexOf(id) === i; }).slice(0, 3)
      : [];

    var validActiveIds = core.concat(electives);
    var targetActive = (data.active && validActiveIds.indexOf(data.active) >= 0)
      ? data.active
      : (validActiveIds[0] || 'eng');

    var bafsOpt = data.bafsOption === '2B' ? '2B' : '2A';
    var vaOpt = data.vaOption === 'p2' ? 'p2' : 'p1';

    return Object.assign({}, defaultState(), {
      onboarded: true,
      core: core,
      electives: electives,
      bafsOption: bafsOpt,
      vaOption: vaOpt,
      active: targetActive,
      entries: sanitizeEntries(data.entries, { bafsOption: bafsOpt, vaOption: vaOpt }),
      language: data.language === 'zh' ? 'zh' : 'en',
      theme: data.theme === 'light' ? 'light' : 'oled',
      sortMode: ['chrono', 'completion', 'score', 'time'].indexOf(data.sortMode) >= 0 ? data.sortMode : 'chrono',
      filterMode: ['all', 'done', 'pending', 'redo'].indexOf(data.filterMode) >= 0 ? data.filterMode : 'all',
      targetLevel: CUTOFF_LEVELS.indexOf(data.targetLevel) >= 0 ? data.targetLevel : '4',

  /* Quote only the fields that would otherwise break the row; "" escapes a quote. */
  function csvField(value) {
    var s = value === null || value === undefined ? '' : String(value);
    if (/^[=+\-@]/.test(s)) s = "'" + s;
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  /* Papers swapped by an option (BAFS 2A/2B, VA P1/P2) keep entries for both variants,
     so a row for the variant that is not selected still needs its name. */
  function paperById(sid, row, pid, state) {
    var subject = SUBJECTS[sid];
    if (!subject) return null;
    var list = subject.papersFor(row, state);
    var i;
    for (i = 0; i < list.length; i++) if (list[i].id === pid) return list[i];
    var alternate = sid === 'bafs'
      ? { bafsOption: state.bafsOption === '2B' ? '2A' : '2B' }
      : sid === 'va'
      ? { vaOption: state.vaOption === 'p2' ? 'p1' : 'p2' }
      : null;
    if (!alternate) return null;
    list = subject.papersFor(row, alternate);
    for (i = 0; i < list.length; i++) if (list[i].id === pid) return list[i];
    return null;
  }

  function entryStatusKey(entry) {
    var e = entry || {};
    var score = e.score ? String(e.score).trim() : '';

    var time = Number(e.timeSpent) > 0;
